<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stats, teams, seasons and leaders for the Jackson Weite League, a fictional baseball league.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d4836">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231d4836'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='28' font-weight='700' fill='%23f3efe2' text-anchor='middle'%3EJW%3C/text%3E%3C/svg%3E">
<title>Jackson Weite League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: a reference book on the web — ivy-green masthead + sticky nav, one 1180px column of dense, sortable stat tables; team pages recolor the band with franchise colors. */
:root{
  --paper:#f5f7f2; --card:#ffffff; --ink:#18221d; --muted:#5a6a62; --rule:#d6ddd5; --zebra:#f1f4ee; --thead:#e5ebe2;
  --ivy:#1d4836; --ivy-ink:#f3efe2; --gold:#9c6f00; --gold-bg:#fbefc9; --link:#1a5796; --sil:#8a968f; --sil-bg:#e1e7e1;
  --display:"Graduate","Rockwell","Roboto Slab",Georgia,serif;
  --body:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --team:#1d4836; --team2:#c9962b;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#17201b; --ink:#e3eae5; --muted:#98a79f; --rule:#2b3731; --zebra:#1b2520; --thead:#212e27;
  --ivy:#173b2c; --ivy-ink:#efe8d2; --gold:#e8b94a; --gold-bg:#3b3119; --link:#86baf0; --sil:#647169; --sil-bg:#232f29; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#17201b; --ink:#e3eae5; --muted:#98a79f; --rule:#2b3731; --zebra:#1b2520; --thead:#212e27;
  --ivy:#173b2c; --ivy-ink:#efe8d2; --gold:#e8b94a; --gold-bg:#3b3119; --link:#86baf0; --sil:#647169; --sil-bg:#232f29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ivy)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:.01em}
h2{font-size:18px;font-weight:800;letter-spacing:.01em;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:10px}
h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:12px}

/* masthead + nav */
.mast{background:var(--ivy);color:var(--ivy-ink)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--ivy-ink);text-decoration:none!important}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--rule)}
.navbar .wrap{display:flex;align-items:center;gap:4px 18px;flex-wrap:wrap;padding-block:6px}
.navbar nav{display:flex;gap:2px;flex-wrap:wrap}
.navbar nav a{color:var(--ink);font-weight:700;font-size:13px;padding:6px 10px;border-radius:var(--r)}
.navbar nav a.on{background:var(--thead)}
.search{position:relative;margin-left:auto;flex:1 1 220px;max-width:340px}
.search input{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);color:var(--ink)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:360px;overflow:auto;z-index:20}
.sres a{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--ink)}
.sres a.hl,.sres a:hover{background:var(--zebra);text-decoration:none}
.sres img{width:22px;height:22px;object-fit:contain}

main{padding-block:20px 48px}
section{margin-top:28px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid>*{min-width:0}

/* page header */
.phead{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.phead .info{flex:1 1 280px;min-width:0;display:grid;gap:6px}
.phead p{margin:0}
.headshot{width:120px;height:140px;border-radius:var(--r);overflow:hidden;flex:none;border:1px solid var(--rule)}
.headshot svg{display:block;width:100%;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border:1px solid var(--rule);border-radius:999px;background:var(--card);font-size:12px;font-weight:600;color:var(--ink)}
.chip img{width:20px;height:20px;object-fit:contain}
.chip:hover{text-decoration:none;border-color:var(--ink)}
.summary{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);margin-top:16px}
.summary .lab{padding:8px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;border-right:1px solid var(--rule)}
.summary div.s{padding:8px 16px;border-right:1px solid var(--rule)}
.summary div.s:last-child{border-right:0}
.summary b{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.summary span{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:8px;flex-wrap:wrap}

/* team band */
.band{background:var(--team);color:#fff;border-radius:var(--r);padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:var(--team2)}
.band .art{width:132px;height:132px;flex:none;background:rgba(255,255,255,.92);border-radius:var(--r);display:grid;place-items:center;padding:8px}
.band .art img{max-width:100%;max-height:100%;object-fit:contain}
.band .txt{flex:1 1 260px;min-width:0;display:grid;gap:6px}
.band h1{color:#fff}
.band p{margin:0;opacity:.92}
.band a{color:#fff;text-decoration:underline}
.band .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:700}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
table.st{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st th,.st td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--zebra)}
.st th{background:var(--thead);font-weight:700;font-size:12px;position:sticky;top:0;cursor:default;user-select:none}
.st th[data-k]{cursor:pointer}
.st th[data-k]:hover{background:var(--rule)}
.st th.sorted::after{content:" ▾";font-size:10px}
.st th.sorted.asc::after{content:" ▴"}
.st .l{text-align:left}
.st tbody tr:nth-child(even){background:var(--zebra)}
.st tbody tr:hover{background:var(--gold-bg)}
.st tfoot td{font-weight:700;border-top:2px solid var(--ink);background:var(--card)}
.st tfoot tr+tr td{border-top:1px solid var(--rule);font-weight:600}
.st tr.sub td{color:var(--muted)}
.st tr.sub td.l{padding-left:20px}
.st td.led{font-weight:800;background:var(--gold-bg);color:var(--ink)}
.st td img{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.note b.led{background:var(--gold-bg);padding:0 4px;font-weight:800;color:var(--ink)}

/* leader boards */
.board{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);overflow:hidden}
.board h3{margin:0;padding:8px 12px;background:var(--thead);color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.board h3 small{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.board ol{margin:0;padding:4px 0;list-style:none;counter-reset:n}
.board li{display:grid;grid-template-columns:24px 1fr auto;gap:6px;padding:3px 12px;align-items:baseline;font-size:13px;counter-increment:n}
.board li::before{content:counter(n) ".";color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.board li .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .who em{font-style:normal;color:var(--muted);font-size:12px}
.board li .v{font-weight:700;font-variant-numeric:tabular-nums}
.board li:first-child .v{color:var(--gold)}

/* home */
.hero{background:var(--ivy);color:var(--ivy-ink);border-radius:var(--r);padding:28px 22px 20px;display:grid;gap:14px}
.hero h1{font-size:clamp(30px,6vw,56px);color:var(--ivy-ink)}
.hero .facts{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.strip a{background:rgba(255,255,255,.94);border-radius:var(--r);padding:8px;display:grid;place-items:center;gap:4px;color:#1d2a22;font-size:11px;font-weight:700;text-align:center;text-decoration:none;transition:transform .15s}
.strip a:hover{transform:translateY(-2px)}
.strip img{height:52px;width:100%;object-fit:contain}
.strip a.gone{opacity:.7}
.yearlist{display:flex;flex-wrap:wrap;gap:6px}
.yearlist a{padding:6px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.yearlist a:hover{border-color:var(--ink);text-decoration:none}
.spot{display:flex;gap:14px;align-items:center;border:1px solid var(--rule);background:var(--card);border-radius:var(--r);padding:12px}
.spot .headshot{width:84px;height:98px}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;border:1px solid var(--rule);background:var(--card);border-radius:var(--r);padding:8px 12px}
.rec dt{color:var(--muted);font-weight:600}
.rec dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.rec dd b{margin-left:6px}
.rec .who{grid-column:1/-1;font-size:12px;margin-bottom:4px}

/* players index */
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-block:10px 16px}
.letters a{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:var(--r);font-weight:800;background:var(--card);color:var(--ink)}
.letters a.on{background:var(--ink);color:var(--paper)}
.letters a.none{opacity:.35;pointer-events:none}
.plist{columns:3 240px;column-gap:28px;font-size:13px}
.plist div{break-inside:avoid;padding:2px 0}
.plist .y{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}

/* teams index & logos */
.tcard{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);overflow:hidden;color:var(--ink);display:grid}
.tcard:hover{text-decoration:none;border-color:var(--ink)}
.tcard .top{height:120px;display:grid;place-items:center;background:var(--sil-bg);border-bottom:5px solid var(--c1)}
.tcard .top img{max-height:100px;max-width:80%;object-fit:contain}
.tcard .bot{padding:10px 12px;display:grid;gap:2px}
.tcard b{font-size:15px}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.logos figure{margin:0;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);overflow:hidden}
.logos .im{height:130px;display:grid;place-items:center;padding:10px;background:repeating-conic-gradient(var(--zebra) 0% 25%,var(--card) 0% 50%) 50%/16px 16px}
.logos img{max-height:110px;max-width:100%;object-fit:contain}
.logos figcaption{font-size:12px;padding:6px 10px;border-top:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:13px;padding:6px 14px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.controls{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:6px 8px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);color:var(--ink)}
footer{border-top:1px solid var(--rule);color:var(--muted);font-size:12px}
footer .wrap{padding-block:18px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.tag{display:inline-block;vertical-align:middle;font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--gold-bg);color:var(--gold);border:1px solid currentColor;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <a class="brand" href="#home"><b>Jackson Weite League</b><span>Reference</span></a>
</div></header>
<div class="navbar"><div class="wrap">
  <nav id="nav">
    <a href="#home" data-n="home">Home</a>
    <a href="#players" data-n="players">Players</a>
    <a href="#teams" data-n="teams">Teams</a>
    <a href="#seasons" data-n="seasons">Seasons</a>
    <a href="#leaders" data-n="leaders">Leaders</a>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Search players or teams" autocomplete="off" aria-label="Search players or teams">
    <div class="sres" id="sres" hidden></div>
  </div>
</div></div>
<main class="wrap" id="app"><div class="loading">Loading the record books…</div></main>
<footer><div class="wrap">Jackson Weite League is a fictional league. Player names belong to the league's simulated seasons, and every stat here is a JWL stat. Sort any table by clicking a column header.</div></footer>

<script>
"use strict";
/* ---------- franchise styling ---------- */
const FR_META={
  AGI:{c1:"#a3142a",c2:"#13284c"}, SB:{c1:"#3a2a1a",c2:"#e8b931"}, MH:{c1:"#0f3a5f",c2:"#f2c418"},
  HST:{c1:"#1f5a2c",c2:"#a0682c"}, FB:{c1:"#1d4a32",c2:"#e06b10"}, BH:{c1:"#173f8a",c2:"#22b4f0"},
  SW:{c1:"#7a1f1f",c2:"#d8a848"}, ED:{c1:"#5a4220",c2:"#e3b44a"}, WF:{c1:"#3d3420",c2:"#e6c34a"}
};
const CODE_LOGO={GG:["MH","old3"],RN:["SW","old3"],MMG:["WF","old3"]};
const ROLE_LABEL={monogram:"Primary mark",mascot:"Mascot",wordmark:"Wordmark",historical:"Historical mascot",alt1:"Alternate mark",alt2:"Alternate mark",old1:"Former mascot",old2:"Former wordmark",old3:"Former mark",old4:"Former mark"};

/* ---------- state ---------- */
let PL={}, PLIST=[], BAT=[], PIT=[], FR=null, LOGO={}, TEAMS={}, YEARS=[], SG={}, TS={}, BPY=new Map(), PPY=new Map(), LED={};
const app=document.getElementById("app");
const TABLES={}; let tid=0;

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=p=>p.first+" "+p.last;
const plink=(id,label)=>`<a href="#p-${id}">${esc(label??nm(PL[id]))}</a>`;
const frOf=code=>TEAMS[code]?.franchise||code;
const tname=code=>TEAMS[code]?.name||code;
function logoUrl(code,role="monogram",big=false){
  let fid=frOf(code), r=role;
  if(role==="monogram"&&CODE_LOGO[code]) [fid,r]=CODE_LOGO[code];
  const e=LOGO[fid]?.[r]; return e?(big?e.file:e.sm):"";
}
const timg=(code,role)=>{const u=logoUrl(code,role);return u?`<img src="${u}" alt="" loading="lazy">`:""};
const tlink=(code,y)=>y?`<a href="#ts-${code.toLowerCase()}-${y}">${code}</a>`:`<a href="#t-${frOf(code).toLowerCase()}">${code}</a>`;
function yrsText(ys){ys=[...new Set(ys)].sort((a,b)=>a-b);const out=[];let s=ys[0],p=ys[0];
  for(let i=1;i<=ys.length;i++){const y=ys[i];if(y===p+1){p=y;continue}out.push(s===p?`${s}`:`${s}–${String(p).slice(2)}`);s=p=y}
  return out.join(", ")}
const span=ys=>{ys=[...new Set(ys)].sort();return ys.length?(ys[0]===ys[ys.length-1]?`${ys[0]}`:`${ys[0]}–${ys[ys.length-1]}`):""};
const avg=v=>v==null||!isFinite(v)?"—":v.toFixed(3).replace(/^0(?=\.)/,"");
const f2=v=>v==null||!isFinite(v)?"—":v.toFixed(2);
const f1=v=>v==null||!isFinite(v)?"—":v.toFixed(1);
const pct=v=>v==null||!isFinite(v)?"—":v.toFixed(3).replace(/^0(?=\.)/,"");
const n0=v=>v==null?"—":v;
const ipf=o=>o==null?"—":`${Math.floor(o/3)}.${o%3}`;
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const ord=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");

/* ---------- stat math (Jordan's sheet formulas) ---------- */
const BK=["G","AB","R","H","2B","3B","HR","RBI","SB","CS","BB","IBB","HBP","SO","SAC","SACF","SACB","GIDP","ROE"];
function sumBat(rows){const s={};for(const k of BK){let t=0,nul=false;for(const r of rows){if(r[k]==null)nul=true;else t+=r[k]}s[k]=t;if(k==="G"&&nul)s.G=null}
  s.TBB=s.BB+s.HBP+s.IBB; s.WALKS=s.BB+s.IBB; s.PA=s.AB+s.SAC+s.TBB;
  s.TB=s.H+s["2B"]+2*s["3B"]+3*s.HR;
  s.BA=s.AB?s.H/s.AB:null; s.SLG=s.AB?s.TB/s.AB:null;
  const d=s.AB+s.TBB+s.SACF; s.OBP=d?(s.H+s.TBB)/d:null; s.OPS=s.OBP!=null&&s.SLG!=null?s.OBP+s.SLG:null; return s}
const PK=["G","GS","W","L","SV","OUTS","H","ER","BB","K"];
function sumPit(rows){const s={};for(const k of PK){let t=0,nul=false;for(const r of rows){if(r[k]==null)nul=true;else t+=r[k]}s[k]=t;if((k==="G"||k==="GS")&&nul)s[k]=null}
  const o=s.OUTS; s.IP=o; s.ERA=o?s.ER*27/o:null; s.WHIP=o?(s.BB+s.H)*3/o:null; s.H9=o?s.H*27/o:null; s.BB9=o?s.BB*27/o:null; s.SO9=o?s.K*27/o:null;
  s.WLP=(s.W+s.L)?s.W/(s.W+s.L):null; s.SOW=s.BB?s.K/s.BB:null; return s}

/* ---------- leader definitions ---------- */
const BSTATS=[{k:"HR",l:"Home Runs"},{k:"RBI",l:"Runs Batted In"},{k:"H",l:"Hits"},{k:"R",l:"Runs Scored"},{k:"BA",l:"Batting Average",rate:1,f:avg},{k:"OPS",l:"On-Base Plus Slugging",rate:1,f:avg},
  {k:"OBP",l:"On-Base Percentage",rate:1,f:avg},{k:"SLG",l:"Slugging Percentage",rate:1,f:avg},{k:"SB",l:"Stolen Bases"},{k:"TB",l:"Total Bases"},{k:"2B",l:"Doubles"},{k:"3B",l:"Triples"},{k:"WALKS",l:"Walks"}];
const PSTATS=[{k:"W",l:"Wins"},{k:"K",l:"Strikeouts"},{k:"ERA",l:"Earned Run Average",rate:1,low:1,f:f2},{k:"SV",l:"Saves"},{k:"WHIP",l:"WHIP",rate:1,low:1,f:f2},{k:"IP",l:"Innings Pitched",f:ipf},
  {k:"SO9",l:"Strikeouts per 9",rate:1,f:f2},{k:"GS",l:"Games Started"},{k:"WLP",l:"Win-Loss %",rate:1,f:pct,minW:5}];
const CAREER_PA=500, CAREER_OUTS=450;
/* Every JWL season is a 42-game schedule. A team-season whose stats cover well under 42 games
   (innings pitched ÷ 9 below PARTIAL_BELOW) is a season still in progress: it shows games played so far,
   and its players' rate-stat qualifiers use those games. */
const SEASON_G=42, PARTIAL_BELOW=38, IN_PROG=new Set();
const tag=`<span class="tag">In progress</span>`;
const qualB=(s,y,qg)=>y?s.PA>=3.1*(qg??SG[y]):s.PA>=CAREER_PA;
const qualP=(s,y,qg)=>y?s.OUTS>=3*(qg??SG[y]):s.OUTS>=CAREER_OUTS;
const gCell=r=>r.partial?`<span title="Season in progress: ${r.rec} of ${SEASON_G} games played">${r.rec} <span class="muted">of ${SEASON_G}</span></span>`:SEASON_G;

/* ---------- load & index ---------- */
async function load(){
  const get=f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()});
  const [players,bat,pit,fr,logos]=await Promise.all(["data/players.json","data/batting.json","data/pitching.json","data/franchises.json","logos/manifest.json"].map(get));
  PLIST=players; for(const p of players){PL[p.id]={...p,bat:[],pit:[]}}
  BAT=bat; PIT=pit; FR=fr; LOGO=logos; TEAMS=fr.teams;
  const ys=new Set(), outs={};
  for(const r of BAT){PL[r.p].bat.push(r);ys.add(r.y);(TS[r.t+"-"+r.y]??={t:r.t,y:r.y,bat:[],pit:[]}).bat.push(r)}
  for(const r of PIT){PL[r.p].pit.push(r);ys.add(r.y);(TS[r.t+"-"+r.y]??={t:r.t,y:r.y,bat:[],pit:[]}).pit.push(r);outs[r.t+"-"+r.y]=(outs[r.t+"-"+r.y]||0)+r.OUTS}
  YEARS=[...ys].sort((a,b)=>a-b);
  for(const k in TS){const rec=(outs[k]||0)/27,t=TS[k];t.games=SEASON_G;t.rec=Math.round(rec);t.partial=rec<PARTIAL_BELOW;t.qg=t.partial?t.rec:SEASON_G;if(t.partial)IN_PROG.add(t.y)}
  for(const y of YEARS){SG[y]=SEASON_G}
  const group=(rows,map,sum)=>{const g=new Map();for(const r of rows){const k=r.p+"|"+r.y;(g.get(k)||g.set(k,[]).get(k)).push(r)}
    for(const [k,rs] of g){map.set(k,{p:rs[0].p,y:rs[0].y,teams:rs.map(r=>r.t),rows:rs,s:sum(rs),qg:Math.max(...rs.map(r=>TS[r.t+"-"+r.y].qg))})}};
  group(BAT,BPY,sumBat); group(PIT,PPY,sumPit);
  for(const y of YEARS){LED[y]={};
    for(const [defs,map,q] of [[BSTATS,BPY,qualB],[PSTATS,PPY,qualP]]){
      const pool=[...map.values()].filter(a=>a.y===y);
      for(const d of defs){const el=pool.filter(a=>d.rate?q(a.s,y,a.qg)&&(!d.minW||a.s.W+a.s.L>=d.minW):true).filter(a=>a.s[d.k]!=null);
        if(!el.length)continue; const best=d.low?Math.min(...el.map(a=>a.s[d.k])):Math.max(...el.map(a=>a.s[d.k]));
        if(!d.low&&best<=0)continue; LED[y][(map===BPY?"b":"p")+d.k]=new Set(el.filter(a=>a.s[d.k]===best).map(a=>a.p))}}}
}

/* ---------- leader boards ---------- */
function board(kind,d,scope,limit=10,filter){
  const isB=kind==="b", q=isB?qualB:qualP; let pool;
  if(scope==="career"){const m=new Map();
    for(const a of (isB?BPY:PPY).values()){if(filter&&!filter(a))continue;(m.get(a.p)||m.set(a.p,[]).get(a.p)).push(...(filter?a.rows.filter(filter.row||(()=>true)):a.rows))}
    pool=[...m].map(([p,rows])=>({p,ys:rows.map(r=>r.y),s:(isB?sumBat:sumPit)(rows)}));
    if(d.rate)pool=pool.filter(a=>filter?.qual?filter.qual(a.s):q(a.s,null));
  }else{pool=[...(isB?BPY:PPY).values()];if(scope!=="all")pool=pool.filter(a=>a.y===scope);
    if(d.rate)pool=pool.filter(a=>q(a.s,a.y,a.qg));}
  if(d.minW)pool=pool.filter(a=>a.s.W+a.s.L>=(scope==="career"?15:d.minW));
  pool=pool.filter(a=>a.s[d.k]!=null&&(d.rate||a.s[d.k]>0));
  pool.sort((a,b)=>d.low?a.s[d.k]-b.s[d.k]:b.s[d.k]-a.s[d.k]);
  return pool.slice(0,limit);
}
function boardHTML(kind,d,scope,limit=10,filter,title){
  const rows=board(kind,d,scope,limit,filter), f=d.f||n0;
  const li=rows.map(a=>`<li><span class="who">${plink(a.p)} <em>${scope==="career"?span(a.ys):(scope==="all"?a.y+" ":"")+(a.teams||[]).join("/")}</em></span><span class="v">${f(a.s[d.k])}</span></li>`).join("");
  const sub=scope==="career"?(d.rate?(kind==="b"?`min ${filter?.minLabel||CAREER_PA+" PA"}`:`min ${filter?.minLabel||CAREER_OUTS/3+" IP"}`):"career"):(scope==="all"?"single season":scope);
  return `<div class="board"><h3>${esc(title||d.l)} <small>${sub}</small></h3><ol>${li||'<li class="muted"><span></span><span>No qualifiers</span></li>'}</ol></div>`;
}

/* ---------- sortable tables ---------- */
function table(cols,rows,{foot=[],sortable=true,rowCls}={}){
  const id="t"+(++tid); TABLES[id]={cols,rows,foot,rowCls,sort:null,asc:false};
  return `<div class="tw"><table class="st" data-tid="${id}"><thead><tr>${cols.map((c,i)=>`<th class="${c.a==="l"?"l":""}" ${sortable&&c.v!==false?`data-k="${i}" tabindex="0"`:""} title="${esc(c.t||c.l)}">${c.l}</th>`).join("")}</tr></thead><tbody>${bodyRows(id)}</tbody>${foot.length?`<tfoot>${foot.map(r=>rowHTML(cols,r,"")).join("")}</tfoot>`:""}</table></div>`;
}
function rowHTML(cols,r,cls){return `<tr class="${cls||""}">${cols.map(c=>{const led=c.led&&c.led(r);return `<td class="${c.a==="l"?"l":""}${led?" led":""}"${led?' title="Led the JWL"':""}>${c.f(r)}</td>`}).join("")}</tr>`}
function bodyRows(id){const T=TABLES[id];return T.rows.map(r=>rowHTML(T.cols,r,T.rowCls?T.rowCls(r):"")).join("")}
function sortTable(th){
  const tb=th.closest("table"), id=tb.dataset.tid, T=TABLES[id], i=+th.dataset.k, c=T.cols[i];
  T.asc=T.sort===i?!T.asc:(c.a==="l"); T.sort=i;
  const val=c.v||c.f; const key=r=>{let v=val(r);if(typeof v==="string"){const n=parseFloat(v.replace(/<[^>]+>/g,""));return isNaN(n)?v.replace(/<[^>]+>/g,"").toLowerCase():n}return v??-Infinity};
  T.rows=[...T.rows].sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*(T.asc?1:-1)});
  T.rowCls=null; tb.tBodies[0].innerHTML=bodyRows(id);
  tb.querySelectorAll("th").forEach(h=>h.classList.remove("sorted","asc")); th.classList.add("sorted"); if(T.asc)th.classList.add("asc");
}
app.addEventListener("click",e=>{const th=e.target.closest("th[data-k]");if(th)sortTable(th)});
app.addEventListener("keydown",e=>{if(e.key==="Enter"){const th=e.target.closest("th[data-k]");if(th)sortTable(th)}});

const c=(l,f,o={})=>({l,f,...o});
function batCols(ledFn,first){return [first,

  c("RBI",r=>r.s.RBI,{v:r=>r.s.RBI,led:ledFn("bRBI")}),c("SB",r=>r.s.SB,{v:r=>r.s.SB,led:ledFn("bSB")}),c("CS",r=>r.s.CS,{v:r=>r.s.CS}),
  c("BB",r=>r.s.WALKS,{v:r=>r.s.WALKS,t:"Walks (incl. intentional)",led:ledFn("bWALKS")}),c("HBP",r=>r.s.HBP,{v:r=>r.s.HBP}),c("SO",r=>r.s.SO,{v:r=>r.s.SO,t:"Strikeouts"}),

const curName=f=>[...f.names].sort((a,b)=>Math.max(...b.years,0)-Math.max(...a.years,0))[0].name;

function roleOf(p){if(!p.bat.length)return"Pitcher";const pa=sumBat(p.bat).PA, outs=p.pit.reduce((t,r)=>t+r.OUTS,0);

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1); let m; setTeamColors(null);
  for(const k in TABLES)delete TABLES[k];
  if(!h||h==="home")home();
  else if(m=h.match(/^p-([a-z0-9-]+)$/))playerPage(m[1]);
  else if(m=h.match(/^players-([a-z])$/))playersIndex(m[1]);
  else if(h==="players")playersIndex("a");
  else if(h==="teams")teamsIndex();
  else if(m=h.match(/^t-([a-z]+)$/))franchisePage(m[1].toUpperCase());
  else if(m=h.match(/^ts-([a-z]+)-(\d{4})$/))teamSeason(m[1].toUpperCase(),+m[2]);
  else if(h==="seasons")seasonsIndex();
  else if(m=h.match(/^s-(\d{4})$/))seasonPage(+m[1]);
  else if(h==="leaders")leadersPage();
  else notFound();
  const sec=!h||h==="home"?"home":h.startsWith("p")?"players":h.startsWith("t")?"teams":h.startsWith("s")?"seasons":h;
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===sec));
  window.scrollTo(0,0);
}

const q=document.getElementById("q"), sres=document.getElementById("sres"); let hits=[],hi=0;
function doSearch(){const s=q.value.trim().toLowerCase(); if(s.length<2){sres.hidden=true;return}
  const fr=FR.franchises.flatMap(f=>f.names.map(n=>({f,n}))).filter(x=>x.n.name.toLowerCase().includes(s)||x.n.code.toLowerCase()===s).slice(0,3)
    .map(x=>({href:`#t-${x.f.id.toLowerCase()}`,html:`${timg(x.n.code)}<b>${esc(x.n.name)}</b> <span class="muted small">franchise</span>`}));
  const pl=PLIST.filter(p=>(p.first+" "+p.last).toLowerCase().includes(s)||(p.last+", "+p.first).toLowerCase().includes(s)).slice(0,10)
    .map(p=>({href:`#p-${p.id}`,html:`${timg(lastTeam(PL[p.id]))}<span>${esc(nm(p))}</span> <span class="muted small">${span(yearsOf(PL[p.id]))}</span>`}));
  hits=[...fr,...pl]; hi=0;
  sres.innerHTML=hits.length?hits.map((x,i)=>`<a href="${x.href}" class="${i===0?"hl":""}">${x.html}</a>`).join(""):`<div style="padding:8px 10px" class="muted">No matches</div>`; sres.hidden=false}
q.addEventListener("input",doSearch);
q.addEventListener("keydown",e=>{if(sres.hidden)return;const as=sres.querySelectorAll("a");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=(hi+(e.key==="ArrowDown"?1:-1)+as.length)%as.length;as.forEach((a,i)=>a.classList.toggle("hl",i===hi))}
  else if(e.key==="Enter"&&hits[hi]){location.hash=hits[hi].href;q.value="";sres.hidden=true;q.blur()}
  else if(e.key==="Escape"){sres.hidden=true}});
sres.addEventListener("click",()=>{q.value="";sres.hidden=true});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))sres.hidden=true});

window.addEventListener("hashchange",route);
load().then(route).catch(err=>{app.innerHTML=`<h1>Couldn't load the stats</h1><p class="muted">${esc(err.message)} is missing. Reload the page to try again.</p>`;console.error(err)});
</script>
</body>
</html>
